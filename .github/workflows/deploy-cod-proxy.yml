# Deploy the COD CORS Cloudflare Worker (CIF + /search + /crossref + /visits).
#
# Repo secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
# After the worker is live, rebuild Pages with:
#   VITE_COD_PROXY="https://YOUR_WORKER.workers.dev/{id}.cif"
name: Deploy COD CORS proxy
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/cod-cors-worker.js'
      - 'scripts/wrangler.cod-proxy.toml'
      - '.github/workflows/deploy-cod-proxy.yml'
      - 'scripts/github-workflows/deploy-cod-proxy.yml'
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c scripts/wrangler.cod-proxy.toml
